listen: 0.0.0.0:8080
listen_pprof: 0.0.0.0:7008
listen_metrics_address: 0.0.0.0:9090
metrics_include_tenant: true

target: http://127.0.0.1:9091/receive
target_otlp: http://127.0.0.1:9009/otlp/v1/metrics
target_traces: http://127.0.0.1:4318/v1/traces
otlp_egress_gzip: false
enable_ipv6: false
max_conns_per_host: 64
max_request_body_size: 8388608

auth:
  egress:
    username: foo
    password: bar

log_level: debug
timeout: 10s
timeout_shutdown: 0s
concurrency: 10
metadata: false
log_response_errors: true

tenant:
  label: tenant
  label_list:
    - tenant
    - other_tenant
  prefix: ""
  prefix_prefer_source: false
  label_remove: true
  header: X-Scope-OrgID
  default: ""
  accept_all: false
